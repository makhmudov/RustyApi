[workspace]
resolver = "3"
members = ["rustyapi", "rustyapi-macros", "rustyapi-cli", "examples/todo_api"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/makhmudov/RustyApi"

[workspace.dependencies]
# Внутренние crates
rustyapi = { path = "rustyapi", version = "0.0.1" }
rustyapi-macros = { path = "rustyapi-macros", version = "0.0.1" }

# Рантайм
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit", "timeout", "fs", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
form_urlencoded = "1"
serde_path_to_error = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
jsonwebtoken = "9"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dotenvy = "0.15"
envy = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Proc-macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Тесты
trybuild = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
notify = "8"

[profile.dev.package."*"]
# Зависимости собираются с оптимизацией: быстрее рантайм, пересборка своего кода не дороже
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
