[package]
name = "actix_bench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros"] }
