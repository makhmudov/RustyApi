name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustyapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustyapi_test
      REDIS_URL: redis://localhost:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  cli-e2e:
    name: cli-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustyapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustyapi_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustyapi-cli --test e2e -- --ignored --test-threads=1 --nocapture

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start examples/production (postgres + redis + app)
        run: docker compose -f examples/production/docker-compose.yml up -d --build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          set -e
          curl -fsS localhost:8000/health
          curl -fsS -X POST localhost:8000/users -H 'content-type: application/json' \
               -d '{"username":"ci_user","password":"supersecret"}'
          TOKEN=$(curl -fsS -X POST localhost:8000/token -d 'username=ci_user&password=supersecret' | jq -r .access_token)
          curl -fsS -X POST localhost:8000/links -H "authorization: Bearer $TOKEN" \
               -H 'content-type: application/json' -d '{"url":"https://example.com","code":"ci-link"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/r/ci-link)" = 307
      - name: Logs
        if: failure()
        run: docker compose -f examples/production/docker-compose.yml logs
