name: Release

# Запускается вручную (Actions → Release → Run workflow) на ветке main.
# Ставит тег v<версия из Cargo.toml> и создаёт GitHub-релиз с разделом из CHANGELOG.md.
# С галочкой publish ещё и публикует крейты на crates.io (нужен секрет CARGO_REGISTRY_TOKEN).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать на crates.io (необратимо, нужен секрет CARGO_REGISTRY_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rustyapi") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "В CHANGELOG.md нет раздела [$VERSION]"; exit 1; }

      - name: Publish to crates.io
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Нет секрета CARGO_REGISTRY_TOKEN"; exit 1; }
          cargo publish -p rustyapi-macros
          cargo publish -p rustyapi
          cargo publish -p rustyapi-cli

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Релиз v$VERSION уже есть"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "RustyAPI $VERSION" --notes-file notes.md
          fi
