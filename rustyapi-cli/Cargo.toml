[package]
name = "rustyapi-cli"
description = "tez — the RustyAPI command line: new, dev (auto-reload), migrate, generate crud/client, routes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["cli", "web", "framework", "fastapi", "scaffolding"]
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]

[[bin]]
name = "tez"
path = "src/main.rs"

[dependencies]
clap.workspace = true
notify.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
dotenvy.workspace = true
chrono.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
