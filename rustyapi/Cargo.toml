[package]
name = "rustyapi"
description = "FastAPI-style web framework for Rust: route attributes, validated schemas, OpenAPI docs, PostgreSQL, JWT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["web", "framework", "fastapi", "openapi", "http"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
rustyapi-macros.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
form_urlencoded.workspace = true
sqlx.workspace = true
jsonwebtoken.workspace = true
argon2.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
dotenvy.workspace = true
envy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
redis = { workspace = true, optional = true }

[features]
default = []
# Кэш в Redis (`Cache::redis`, `App::cache_from_env`). Без фичи доступен кэш в памяти.
redis = ["dep:redis"]

[dev-dependencies]
trybuild.workspace = true
http-body-util.workspace = true
